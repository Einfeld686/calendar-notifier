name: Scheduled Crawl

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: Monitor bucket to run
        required: true
        default: due
        type: choice
        options:
          - due
          - rule
          - content
          - all
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 21,3,9,14 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      APP_DB_BACKEND: postgres
      APP_STORAGE_BACKEND: s3
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      BASE_URL: ${{ secrets.BASE_URL }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      REVIEWER_LABEL: ${{ secrets.REVIEWER_LABEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Check crawl configuration
        id: preflight
        run: |
          missing=()
          required=(
            DATABASE_URL
            S3_ENDPOINT
            S3_REGION
            S3_BUCKET
            S3_ACCESS_KEY_ID
            S3_SECRET_ACCESS_KEY
            BASE_URL
            ADMIN_USER
            ADMIN_PASSWORD
            REVIEWER_LABEL
          )

          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "## Crawl Skipped"
              echo
              echo "- reason: required secrets are missing"
              echo
              echo "### Missing"
              for key in "${missing[@]}"; do
                echo "- $key"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: npm ci

      - name: Select crawl bucket
        if: steps.preflight.outputs.ready == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "CRAWL_BUCKET=${{ inputs.bucket }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "0 18 * * *" ]; then
            echo "CRAWL_BUCKET=rule" >> "$GITHUB_ENV"
          else
            echo "CRAWL_BUCKET=content" >> "$GITHUB_ENV"
          fi

      - name: Build
        if: steps.preflight.outputs.ready == 'true'
        run: npm run build

      - name: Run crawl
        if: steps.preflight.outputs.ready == 'true'
        run: npm run crawl:due > crawl-summary.json

      - name: Print crawl summary
        if: steps.preflight.outputs.ready == 'true'
        run: cat crawl-summary.json

      - name: Append workflow summary
        if: steps.preflight.outputs.ready == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";

          const summary = JSON.parse(readFileSync("crawl-summary.json", "utf8"));
          const lines = [
            "## Crawl Summary",
            "",
            `- bucket: ${process.env.CRAWL_BUCKET ?? "due"}`,
            `- monitorsProcessed: ${summary.monitorsProcessed}`,
            `- observationsCreated: ${summary.observationsCreated}`,
            `- candidatesCreated: ${summary.candidatesCreated}`,
            `- publishedCount: ${summary.publishedCount}`,
            `- failedMonitors: ${summary.failedMonitors.length}`,
          ];

          if (summary.failedMonitors.length > 0) {
            lines.push("", "### Failed Monitors");
            for (const failed of summary.failedMonitors) {
              lines.push(`- ${failed.slug}: ${failed.error}`);
            }
          }

          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE
